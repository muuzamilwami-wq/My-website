<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #222;
      text-align: center;
    }

    header {
      background: #111827;
      color: white;
      padding: 25px 15px;
    }

    main {
      padding: 50px 20px;
    }

    .box {
      max-width: 500px;
      margin: auto;
      background: white;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <header>
    <h1>My Website</h1>
    <p>Welcome to our online service</p>
  </header>

  <main>
    <div class="box">
      <h2>Welcome</h2>
      <p>Our website is being built. More features are coming soon.</p>
      <button onclick="alert('Welcome!')">Get Started</button>
    </div>
  </main>

</body>
  </html>
