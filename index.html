<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    main {
      max-width: 500px;
      margin: 50px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
      text-align: center;
    }

    input {
      width: 100%;
      padding: 14px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    #message {
      min-height: 25px;
      margin-top: 15px;
    }

    #timer {
      color: #555;
    }
  </style>
</head>

<body>

<header>
  <h1>My Website</h1>
  <p>Welcome to our online service</p>
</header>

<main>

  <!-- HOME -->
  <div class="card" id="home">
    <h2>Welcome</h2>
    <p>Click below to create your account.</p>

    <button onclick="openSignup()">
      Get Started
    </button>
  </div>


  <!-- SIGN UP -->
  <div class="card hidden" id="signup">

    <h2>Create Account</h2>

    <input
      id="name"
      type="text"
      placeholder="Full name"
    >

    <input
      id="phone"
      type="tel"
      placeholder="+92 3XXXXXXXXX"
    >

    <button
      id="sendButton"
      onclick="sendOTP()"
    >
      Send OTP
    </button>

    <p id="timer"></p>

    <div id="otpArea" class="hidden">

      <input
        id="otp"
        type="text"
        inputmode="numeric"
        maxlength="6"
        placeholder="Enter 6-digit OTP"
      >

      <button onclick="verifyOTP()">
        Verify OTP
      </button>

    </div>

    <p id="message"></p>

  </div>


  <!-- DASHBOARD -->
  <div class="card hidden" id="dashboard">

    <h2>Welcome 🎉</h2>

    <p>
      Your phone number has been successfully verified.
    </p>

  </div>

</main>


<script>

let countdown;
let seconds = 7;


/* GET STARTED */

function openSignup() {

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("signup")
    .classList.remove("hidden");

}


/* SEND OTP */

async function sendOTP() {

  const name =
    document.getElementById("name").value.trim();

  const phone =
    document.getElementById("phone").value.trim();

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("sendButton");


  if (!name) {

    message.textContent =
      "Please enter your name.";

    return;
  }


  if (!phone) {

    message.textContent =
      "Please enter your phone number.";

    return;
  }


  button.disabled = true;

  message.textContent =
    "Sending OTP...";


  try {

    const response = await fetch("/api/send-otp", {

      method: "POST",

      headers: {
        "Content-Type": "application/json"
      },

      body: JSON.stringify({
        name: name,
        phone: phone
      })

    });


    const data = await response.json();


    if (!response.ok) {

      throw new Error(
        data.error || "Could not send OTP."
      );

    }


    document.getElementById("otpArea")
      .classList.remove("hidden");


    message.textContent =
      "OTP sent. Check your SMS.";


    startTimer(
      data.retryAfter || 7
    );


  } catch (error) {

    message.textContent =
      error.message;

    button.disabled = false;

  }

}


/* TIMER */

function startTimer(secondsLeft) {

  clearInterval(countdown);

  const button =
    document.getElementById("sendButton");

  const timer =
    document.getElementById("timer");

  let remaining = secondsLeft;

  button.disabled = true;


  timer.textContent =
    "You can request another OTP in "
    + remaining
    + " seconds.";


  countdown = setInterval(function() {

    remaining--;


    if (remaining > 0) {

      timer.textContent =
        "You can request another OTP in "
        + remaining
        + " seconds.";

    }


    if (remaining <= 0) {

      clearInterval(countdown);

      timer.textContent = "";

      button.disabled = false;

      button.textContent =
        "Send OTP Again";

    }

  }, 1000);

}


/* VERIFY OTP */

async function verifyOTP() {

  const phone =
    document.getElementById("phone").value.trim();

  const otp =
    document.getElementById("otp").value.trim();

  const message =
    document.getElementById("message");


  if (!/^[0-9]{6}$/.test(otp)) {

    message.textContent =
      "Enter a valid 6-digit OTP.";

    return;
  }


  try {

    const response = await fetch(
      "/api/verify-otp",
      {

        method: "POST",

        headers: {
          "Content-Type": "application/json"
        },

        body: JSON.stringify({
          phone: phone,
          otp: otp
        })

      }
    );


    const data =
      await response.json();


    if (!response.ok) {

      throw new Error(
        data.error || "Verification failed."
      );

    }


    document.getElementById("signup")
      .classList.add("hidden");


    document.getElementById("dashboard")
      .classList.remove("hidden");


  } catch (error) {

    message.textContent =
      error.message;

  }

}

</script>

</body>
      </html>
