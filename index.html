<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/* =========================================
   YOUR FIREBASE CONFIG
   ========================================= */

const firebaseConfig = {

  apiKey: "AIzaSyBl8m6ic9j5n2YrSUD08A0kykOTnAt-2v0",

  authDomain: "my-website-2b5f6.firebaseapp.com",

  projectId: "my-website-2b5f6",

  storageBucket: "my-website-2b5f6.firebasestorage.app",

  messagingSenderId: "642649037067",

  appId: "1:642649037067:web:e565a05695af3a76da2a0e",

  measurementId: "G-NP33YW9JHC"

};


/* FIREBASE START */

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);


let confirmationResult = null;
let timer = null;
let seconds = 30;
let loginMode = false;


/* SHOW AUTH */

window.showAuth = function(){

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("auth")
    .classList.remove("hidden");

};


/* LOGIN / SIGNUP */

window.toggleMode = function(){

  loginMode = !loginMode;

  const title =
    document.getElementById("authTitle");

  const nameBox =
    document.getElementById("nameBox");

  const toggle =
    document.getElementById("toggleText");


  if(loginMode){

    title.textContent = "Login";

    nameBox.classList.add("hidden");

    toggle.textContent =
      "Don't have an account? Sign Up";

  }else{

    title.textContent = "Sign Up";

    nameBox.classList.remove("hidden");

    toggle.textContent =
      "Already have an account? Login";

  }

};


/* RECAPTCHA */

function createRecaptcha(){

  if(window.recaptchaVerifier){
    return;
  }

  window.recaptchaVerifier =
    new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {
        size:"normal"
      }
    );

}


/* SEND OTP */

window.sendOTP = async function(){

  const country =
    document.getElementById("country").value;

  let phone =
    document.getElementById("phone")
      .value.trim();

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("sendButton");


  if(!phone){

    message.textContent =
      "Please enter your phone number.";

    return;

  }


  /*
    Remove spaces, brackets, dashes
  */

  phone =
    phone.replace(/[^\d]/g,"");


  /*
    Remove leading zero
  */

  phone =
    phone.replace(/^0+/,"");


  const fullPhone =
    country + phone;


  /*
    E.164 basic check
  */

  if(!/^\+\d{8,15}$/.test(fullPhone)){

    message.textContent =
      "Please enter a valid phone number.";

    return;

  }


  button.disabled = true;

  message.textContent =
    "Sending OTP...";


  try{

    createRecaptcha();


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        fullPhone,
        window.recaptchaVerifier
      );


    document.getElementById("otpBox")
      .classList.remove("hidden");


    message.textContent =
      "OTP sent. Check your SMS.";


    startTimer();


  }catch(error){

    console.error(error);

    message.textContent =
      "Firebase error: " +
      error.message;


    button.disabled = false;


    /*
      Reset reCAPTCHA after error
    */

    try{

      if(window.recaptchaVerifier){

        window.recaptchaVerifier.clear();

        window.recaptchaVerifier = null;

      }

    }catch(e){}

  }

};


/* TIMER */

function startTimer(){

  clearInterval(timer);

  seconds = 30;

  const timerText =
    document.getElementById("timer");

  const button =
    document.getElementById("sendButton");


  timerText.textContent =
    "Resend available in "
    + seconds
    + " seconds";


  timer = setInterval(function(){

    seconds--;


    if(seconds > 0){

      timerText.textContent =
        "Resend available in "
        + seconds
        + " seconds";

    }


    if(seconds <= 0){

      clearInterval(timer);

      timerText.textContent =
        "You can request another OTP.";

      button.disabled = false;

      button.textContent =
        "Send OTP Again";

    }

  },1000);

}


/* VERIFY OTP */

window.verifyOTP = async function(){

  const otp =
    document.getElementById("otp")
      .value.trim();

  const message =
    document.getElementById("message");


  if(!/^[0-9]{6}$/.test(otp)){

    message.textContent =
      "Enter the 6-digit OTP.";

    return;

  }


  if(!confirmationResult){

    message.textContent =
      "Please request an OTP first.";

    return;

  }


  try{

    message.textContent =
      "Verifying OTP...";


    await confirmationResult.confirm(otp);


    document.getElementById("auth")
      .classList.add("hidden");

    document.getElementById("dashboard")
      .classList.remove("hidden");


    message.textContent = "";


  }catch(error){

    console.error(error);

    message.textContent =
      "Incorrect or expired OTP.";

  }

};

</script>
