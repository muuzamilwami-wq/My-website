<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .container {
      max-width: 500px;
      margin: 45px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
      background: white;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .link {
      color: #2563eb;
      cursor: pointer;
      margin-top: 15px;
      text-align: center;
    }

    #message {
      min-height: 25px;
      margin-top: 15px;
      text-align: center;
    }

    #timer {
      text-align: center;
      color: #555;
    }

    #recaptcha-container {
      margin-top: 10px;
      display: flex;
      justify-content: center;
    }
  </style>
</head>

<body>

<header>
  <h1>My Website</h1>
  <p>Welcome to our online service</p>
</header>

<div class="container">

  <!-- HOME -->
  <div class="card" id="home">

    <h2>Welcome</h2>

    <p>Get started with your account.</p>

    <button onclick="showAuth()">
      Get Started
    </button>

  </div>


  <!-- LOGIN / SIGNUP -->
  <div class="card hidden" id="auth">

    <h2 id="authTitle">Sign Up</h2>

    <!-- NAME -->
    <div id="nameBox">

      <input
        id="name"
        type="text"
        placeholder="Full name"
        autocomplete="name"
      >

    </div>


    <!-- COUNTRY -->
    <select id="country">
      <!-- Countries will be added automatically -->
    </select>


    <!-- PHONE -->
    <input
      id="phone"
      type="tel"
      placeholder="Phone number"
      autocomplete="tel"
    >


    <!-- SEND OTP -->
    <button
      id="sendButton"
      onclick="sendOTP()"
    >
      Send OTP
    </button>


    <!-- RECAPTCHA -->
    <div id="recaptcha-container"></div>


    <!-- OTP -->
    <div id="otpBox" class="hidden">

      <input
        id="otp"
        type="text"
        maxlength="6"
        inputmode="numeric"
        placeholder="Enter 6-digit OTP"
      >

      <button onclick="verifyOTP()">
        Verify OTP
      </button>

      <p id="timer"></p>

    </div>


    <!-- MESSAGE -->
    <p id="message"></p>


    <!-- LOGIN / SIGNUP -->
    <p
      class="link"
      onclick="toggleMode()"
      id="toggleText"
    >
      Already have an account? Login
    </p>

  </div>


  <!-- DASHBOARD -->
  <div class="card hidden" id="dashboard">

    <h2>Welcome 🎉</h2>

    <p>
      Your phone number has been verified successfully.
    </p>

    <p id="userPhone"></p>

  </div>

</div>

  let confirmationResult = null;

  let timer = null;

  let seconds = 30;

  let loginMode = false;


  /*

  ==================================================
  */

  window.showAuth = function() {

    document
      .getElementById("home")
      .classList.add("hidden");

    document
      .getElementById("auth")
      .classList.remove("hidden");

  };


  /*
  ==================================================
  LOGIN / SIGNUP SWITCH
  ==================================================
  */

  window.toggleMode = function() {

    loginMode = !loginMode;


    const title =
      document.getElementById("authTitle");


    const nameBox =
      document.getElementById("nameBox");


    const toggle =
      document.getElementById("toggleText");


    if (loginMode) {

      title.textContent = "Login";

      nameBox.classList.add("hidden");

      toggle.textContent =
        "Don't have an account? Sign Up";

      title.textContent = "Sign Up";

      toggle.textContent =
        "Already have an account? Login";

  };


  /*
  ==================================================
  CREATE RECAPTCHA
  ==================================================
  */

  function createRecaptcha() {

    if (window.recaptchaVerifier) {
      return;
    }


    window.recaptchaVerifier =
      new RecaptchaVerifier(
        auth,
        "recaptcha-container",
        {
          size: "normal"
        }
      );

  }


  /*
  ==================================================
  SEND OTP
  ==================================================
  */

  window.sendOTP = async function() {

    const country =
      document.getElementById("country").value;


    const phone =
      document
        .getElementById("phone")
        .value
        .trim();


    const message =
      document.getElementById("message");


    const button =
      document.getElementById("sendButton");


    /*
    PHONE CHECK
    */

    if (!phone) {

      message.textContent =
        "Please enter your phone number.";

      return;

    }


    /*
    REMOVE LEADING ZERO
    */

    const cleanPhone =
      phone.replace(/^0+/, "");


    /*
    FULL INTERNATIONAL NUMBER
    */

    const fullPhone =
      country + cleanPhone;


    console.log(
      "Phone:",
      fullPhone
    );


    button.disabled = true;

    message.textContent =
      "Sending OTP...";


    try {

      /*
      CREATE RECAPTCHA
      */

      createRecaptcha();


      /*
      SEND OTP
      */

      confirmationResult =
        await signInWithPhoneNumber(
          auth,
          fullPhone,
          window.recaptchaVerifier
        );


      /*
      SHOW OTP BOX
      */

      document
        .getElementById("otpBox")
        .classList.remove("hidden");


      message.textContent =
        "OTP sent. Check your SMS.";


      startTimer();


    } catch (error) {

      console.error(
        "Firebase OTP Error:",
        error
      );


      message.textContent =
        error.message ||
        "Unable to send OTP.";


      button.disabled = false;


      /*
      RESET RECAPTCHA
      */

      if (window.recaptchaVerifier) {

        try {

          window.recaptchaVerifier.clear();

        } catch (e) {

          console.log(e);

        }

        window.recaptchaVerifier = null;

      }

    }

  };


  /*
  ==================================================
  TIMER
  ==================================================
  */

  function startTimer() {

    clearInterval(timer);

    seconds = 30;


    const timerText =
      document.getElementById("timer");


    const button =
      document.getElementById("sendButton");


    timerText.textContent =
      "Resend available in " +
      seconds +
      " seconds";


    timer =
      setInterval(() => {

        seconds--;


        if (seconds > 0) {

          timerText.textContent =
            "Resend available in " +
            seconds +
            " seconds";

        }


        if (seconds <= 0) {

          clearInterval(timer);


          timerText.textContent =
            "You can request another OTP.";


          button.disabled = false;


          button.textContent =
            "Send OTP Again";

        }

      }, 1000);

  }


  /*
  ==================================================
  VERIFY OTP
  ==================================================
  */

  window.verifyOTP = async function() {

    const otp =
      document
        .getElementById("otp")
        .value
        .trim();


    const message =
      document.getElementById("message");


    /*
    CHECK OTP
    */

    if (!/^[0-9]{6}$/.test(otp)) {

      message.textContent =
        "Enter the 6-digit OTP.";

      return;

    }


    /*
    CHECK REQUEST
    */

    if (!confirmationResult) {

      message.textContent =
        "Please request an OTP first.";

      return;

    }


    try {

      message.textContent =
        "Verifying...";


      /*
      VERIFY OTP
      */

      const result =
        await confirmationResult.confirm(otp);


      /*
      GET USER
      */

      const user =
        result.user;


      /*
      HIDE AUTH
      */

      document
        .getElementById("auth")
        .classList.add("hidden");


      /*
      SHOW DASHBOARD
      */

      document
        .getElementById("dashboard")
        .classList.remove("hidden");


      /*
      SHOW VERIFIED PHONE
      */

      document
        .getElementById("userPhone")
        .textContent =
        "Verified number: " +
        user.phoneNumber;


    } catch (error) {

      console.error(error);


      message.textContent =
        "Incorrect or expired OTP.";

    }

  };
