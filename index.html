<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #111827;
      color: white;
      text-align: center;
      padding: 30px 15px;
    }

    .container {
      max-width: 500px;
      margin: 45px auto;
      padding: 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    input, select {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 10px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .hidden {
      display: none;
    }

    .link {
      color: #2563eb;
      cursor: pointer;
      margin-top: 15px;
    }

    #message {
      min-height: 25px;
      margin-top: 15px;
    }

    #timer {
      text-align: center;
      color: #555;
    }

    #recaptcha-container {
      margin-top: 10px;
    }
  </style>
</head>

<body>

<header>
  <h1>My Website</h1>
  <p>Welcome to our online service</p>
</header>

<div class="container">

  <!-- HOME -->
  <div class="card" id="home">
    <h2>Welcome</h2>
    <p>Get started with your account.</p>

    <button onclick="showAuth()">
      Get Started
    </button>
  </div>


  <!-- LOGIN / SIGNUP -->
  <div class="card hidden" id="auth">

    <h2 id="authTitle">Sign Up</h2>

    <div id="nameBox">
      <input
        id="name"
        type="text"
        placeholder="Full name"
      >
    </div>

    <select id="country">
      <option value="+92">Pakistan (+92)</option>
      <option value="+1">United States / Canada (+1)</option>
      <option value="+44">United Kingdom (+44)</option>
      <option value="+91">India (+91)</option>
      <option value="+971">UAE (+971)</option>
      <option value="+966">Saudi Arabia (+966)</option>
      <option value="+61">Australia (+61)</option>
      <option value="+49">Germany (+49)</option>
      <option value="+33">France (+33)</option>
      <option value="+81">Japan (+81)</option>
      <option value="+86">China (+86)</option>
    </select>

    <input
      id="phone"
      type="tel"
      placeholder="Phone number"
      autocomplete="tel"
    >

    <button
      id="sendButton"
      onclick="sendOTP()"
    >
      Send OTP
    </button>

    <div id="recaptcha-container"></div>

    <div id="otpBox" class="hidden">

      <input
        id="otp"
        type="text"
        maxlength="6"
        inputmode="numeric"
        placeholder="Enter 6-digit OTP"
      >

      <button onclick="verifyOTP()">
        Verify OTP
      </button>

      <p id="timer"></p>

    </div>

    <p id="message"></p>

    <p
      class="link"
      onclick="toggleMode()"
      id="toggleText"
    >
      Already have an account? Login
    </p>

  </div>


  <!-- DASHBOARD -->
  <div class="card hidden" id="dashboard">

    <h2>Welcome 🎉</h2>

    <p>
      Your phone number has been verified.
    </p>

  </div>

</div>


<!-- Firebase -->
<script type="module">

import {
  initializeApp
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";

import {
  getAuth,
  RecaptchaVerifier,
  signInWithPhoneNumber
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";


/*
==================================================
PUT YOUR FIREBASE CONFIG HERE
==================================================
*/

const firebaseConfig = {

  apiKey: "YOUR_API_KEY",

  authDomain: "YOUR_PROJECT.firebaseapp.com",

  projectId: "YOUR_PROJECT_ID",

  storageBucket: "YOUR_PROJECT.firebasestorage.app",

  messagingSenderId: "YOUR_MESSAGING_SENDER_ID",

  appId: "YOUR_APP_ID"

};


const app =
  initializeApp(firebaseConfig);

const auth =
  getAuth(app);


let confirmationResult = null;
let timer = null;
let seconds = 30;
let loginMode = false;


/* SHOW LOGIN / SIGNUP */

window.showAuth = function() {

  document.getElementById("home")
    .classList.add("hidden");

  document.getElementById("auth")
    .classList.remove("hidden");

};


/* LOGIN / SIGNUP SWITCH */

window.toggleMode = function() {

  loginMode = !loginMode;

  const title =
    document.getElementById("authTitle");

  const nameBox =
    document.getElementById("nameBox");

  const toggle =
    document.getElementById("toggleText");


  if (loginMode) {

    title.textContent = "Login";

    nameBox.classList.add("hidden");

    toggle.textContent =
      "Don't have an account? Sign Up";

  } else {

    title.textContent = "Sign Up";

    nameBox.classList.remove("hidden");

    toggle.textContent =
      "Already have an account? Login";

  }

};


/* RECAPTCHA */

function createRecaptcha() {

  window.recaptchaVerifier =
    new RecaptchaVerifier(
      auth,
      "recaptcha-container",
      {
        size: "normal"
      }
    );

}


/* SEND OTP */

window.sendOTP = async function() {

  const country =
    document.getElementById("country").value;

  const phone =
    document.getElementById("phone")
      .value.trim();

  const message =
    document.getElementById("message");

  const button =
    document.getElementById("sendButton");


  if (!phone) {

    message.textContent =
      "Please enter your phone number.";

    return;

  }


  const fullPhone =
    country + phone.replace(/^0+/, "");


  button.disabled = true;

  message.textContent =
    "Sending OTP...";


  try {

    if (!window.recaptchaVerifier) {
      createRecaptcha();
    }


    confirmationResult =
      await signInWithPhoneNumber(
        auth,
        fullPhone,
        window.recaptchaVerifier
      );


    document.getElementById("otpBox")
      .classList.remove("hidden");


    message.textContent =
      "OTP sent. Check your SMS.";


    startTimer();


  } catch (error) {

    console.error(error);

    message.textContent =
      error.message ||
      "Unable to send OTP.";

    button.disabled = false;

  }

};


/* 30 SECOND TIMER */

function startTimer() {

  clearInterval(timer);

  seconds = 30;

  const timerText =
    document.getElementById("timer");

  const button =
    document.getElementById("sendButton");


  timerText.textContent =
    "Resend available in "
    + seconds
    + " seconds";


  timer = setInterval(() => {

    seconds--;


    if (seconds > 0) {

      timerText.textContent =
        "Resend available in "
        + seconds
        + " seconds";

    }


    if (seconds <= 0) {

      clearInterval(timer);

      timerText.textContent =
        "You can request another OTP.";

      button.disabled = false;

      button.textContent =
        "Send OTP Again";

    }

  }, 1000);

}


/* VERIFY OTP */

window.verifyOTP = async function() {

  const otp =
    document.getElementById("otp")
      .value.trim();

  const message =
    document.getElementById("message");


  if (!/^[0-9]{6}$/.test(otp)) {

    message.textContent =
      "Enter the 6-digit OTP.";

    return;

  }


  if (!confirmationResult) {

    message.textContent =
      "Please request an OTP first.";

    return;

  }


  try {

    message.textContent =
      "Verifying...";


    await confirmationResult.confirm(otp);


    document.getElementById("auth")
      .classList.add("hidden");

    document.getElementById("dashboard")
      .classList.remove("hidden");


  } catch (error) {

    console.error(error);

    message.textContent =
      "Incorrect or expired OTP.";

  }

};

</script>

</body>
  </html>
